<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Daire Ekle - Apartman Yönetim Sistemi</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="layout/main :: header"></div>

<div class="container my-4 content-wrapper">
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center">
                        <h2 class="card-title">
                            <i class="fas fa-home me-2"></i>Yeni Daire Ekle
                        </h2>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/apartments/create}" method="post" th:object="${apartment}">
                        <div class="mb-3">
                            <label class="form-label">Kat No:</label>
                            <input type="number" class="form-control" th:field="*{floor}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Daire No:</label>
                            <input type="number" class="form-control" th:field="*{apartmentNumber}" />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Daire Sakini:</label>
                            <select class="form-select" th:field="*{resident.id}">
                                <option th:each="user : ${residents}"
                                        th:value="${user.id}"
                                        th:text="${user.name + ' ' + user.surname}">Kullanıcı</option>
                            </select>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" th:field="*{occupied}" id="occupiedCheck" />
                            <label class="form-check-label" for="occupiedCheck">
                                Dolu mu?
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary">Kaydet</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="layout/main :: footer"></div>

<script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
