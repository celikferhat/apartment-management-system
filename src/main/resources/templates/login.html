<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Apartman Yönetim Sistemi</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div class="container my-5">
        <div class="login-container">
            <div class="login-logo">
                <i class="fas fa-building"></i>
                <h2 class="mt-3">Apartman Yönetim Sistemi</h2>
                <p class="text-muted">Daire sakinleri ve yöneticiler için</p>
            </div>
            
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Giriş Yap</h4>
                    
                    <div th:if="${param.error}" class="alert alert-danger">
                        Geçersiz kullanıcı adı veya şifre.
                    </div>
                    
                    <div th:if="${param.logout}" class="alert alert-success">
                        Başarıyla çıkış yaptınız.
                    </div>
                    
                    <div th:if="${param.registered}" class="alert alert-success">
                        Kayıt işlemi başarılı! Giriş yapabilirsiniz.
                    </div>
                    
                    <form th:action="@{/login}" method="post">
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Kullanıcı Adı" required>
                            <label for="username">Kullanıcı Adı</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Şifre" required>
                            <label for="password">Şifre</label>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">
                                Beni Hatırla
                            </label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Giriş Yap</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="text-muted">Hesabınız yok mu? <a th:href="@{/register}" class="text-decoration-none">Kayıt Ol</a></div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer mt-auto py-3 bg-white border-top">
        <div class="container text-center">
            <span class="text-muted">© 2025 Apartman Yönetim Sistemi</span>
        </div>
    </footer>

    <script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
