spring.datasource.url=jdbc:mysql://localhost:3306/apartmentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Server configuration
server.port=9090

# Security configuration
jwt.secret=apartmentManagementSecretKey2025
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.apartment.management=DEBUG

# Thymeleaf
spring.thymeleaf.cache=false


