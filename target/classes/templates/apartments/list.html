<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daireler - Apartman Yönetim Sistemi</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="layout/main :: header"></div>
    
    <div class="container my-4 content-wrapper">
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h2 class="card-title">
                                <i class="fas fa-home me-2"></i>Daireler
                            </h2>
                            <a th:href="@{/apartments/create}" class="btn btn-primary">
                                <i class="fas fa-plus me-1"></i>Yeni Daire Ekle
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Daire No</th>
                                        <th>Kat</th>
                                        <th>Oda Sayısı</th>
                                        <th>Alan (m²)</th>
                                        <th>Daire Sakini</th>
                                        <th>Durum</th>
                                        <th>İşlemler</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="apartment : ${apartments}" th:if="${apartments != null && !apartments.empty}">
                                        <td th:text="${apartment.apartmentNumber}">101</td>
                                        <td th:text="${apartment.floor}">1</td>
                                        <td th:text="${apartment.numberOfRooms}">3</td>
                                        <td th:text="${apartment.area}">120</td>
                                        <td th:text="${apartment.resident != null ? apartment.resident.name + ' ' + apartment.resident.surname : '-'}">Ali Yılmaz</td>
                                        <td>
                                            <span th:if="${apartment.occupied}" class="badge bg-success">Dolu</span>
                                            <span th:unless="${apartment.occupied}" class="badge bg-secondary">Boş</span>
                                        </td>
                                        <td>
                                            <div class="btn-group">
                                                <a th:href="@{/apartments/{id}(id=${apartment.id})}" class="btn btn-sm btn-info" data-bs-toggle="tooltip" title="Görüntüle">
                                                    <i class="fas fa-eye"></i>
                                                </a>
                                                <a th:href="@{/apartments/{id}/edit(id=${apartment.id})}" class="btn btn-sm btn-warning" data-bs-toggle="tooltip" title="Düzenle">
                                                    <i class="fas fa-edit"></i>
                                                </a>
                                                <a th:if="${apartment.occupied}" th:href="@{/apartments/{id}/remove-resident(id=${apartment.id})}" class="btn btn-sm btn-danger confirm-delete" data-bs-toggle="tooltip" title="Sakini Çıkar">
                                                    <i class="fas fa-user-minus"></i>
                                                </a>
                                                <a th:unless="${apartment.occupied}" th:href="@{/apartments/{id}/assign-resident(id=${apartment.id})}" class="btn btn-sm btn-success" data-bs-toggle="tooltip" title="Sakin Ata">
                                                    <i class="fas fa-user-plus"></i>
                                                </a>
                                                <a th:href="@{/apartments/{id}/delete(id=${apartment.id})}" class="btn btn-sm btn-danger confirm-delete" data-bs-toggle="tooltip" title="Sil">
                                                    <i class="fas fa-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${apartments == null || apartments.empty}">
                                        <td colspan="7" class="text-center">Daire kaydı bulunamadı.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="layout/main :: footer"></div>

    <script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
