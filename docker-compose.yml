version: '3.8'

services:
  app:
    build: .
    container_name: apartment-management-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/apartmentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
    networks:
      - apartment-network
    restart: always

  mysql:
    image: mysql:8.0
    container_name: apartment-management-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=apartmentdb
      - MYSQL_USER=apartmentuser
      - MYSQL_PASSWORD=apartmentpass
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - apartment-network
    restart: always

networks:
  apartment-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
