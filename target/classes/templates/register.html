<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Apartman Yönetim Sistemi</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/5.15.4/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div class="container my-5">
        <div class="login-container">
            <div class="login-logo">
                <i class="fas fa-building"></i>
                <h2 class="mt-3">Apartman Yönetim Sistemi</h2>
                <p class="text-muted">Daire sakinleri ve yöneticiler için</p>
            </div>
            
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Kayıt Ol</h4>
                    
                    <form th:action="@{/register}" method="post" th:object="${user}">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Ad" required>
                                    <label for="name">Ad</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="surname" th:field="*{surname}" placeholder="Soyad" required>
                                    <label for="surname">Soyad</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="Kullanıcı Adı" required>
                            <label for="username">Kullanıcı Adı</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="E-posta" required>
                            <label for="email">E-posta</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Telefon Numarası">
                            <label for="phoneNumber">Telefon Numarası (905xxxxxxxxx)</label>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Şifre" required>
                            <label for="password">Şifre</label>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Kayıt Ol</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <div class="text-muted">Zaten hesabınız var mı? <a th:href="@{/login}" class="text-decoration-none">Giriş Yap</a></div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer mt-auto py-3 bg-white border-top">
        <div class="container text-center">
            <span class="text-muted">© 2025 Apartman Yönetim Sistemi</span>
        </div>
    </footer>

    <script th:src="@{/webjars/jquery/3.6.0/jquery.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
